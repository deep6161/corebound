        <!-- ==========================================

             Activated on "Begin Story" and "Skip Story"

        <div class="cb-loading-screen" id="cb-loading-screen" aria-hidden="true">
            <!-- Deep Cosmic Space Backdrop -->
            <div class="loading-backdrop">

                <div class="loading-nebula nebula-cyan"></div>
                <div class="loading-grid-overlay"></div>
                <div class="loading-vignette"></div>
            </div>

            <!-- Central Gyroscopic Quantum Core -->
            <div class="loading-core-container">
                <!-- 3D Concentric Orbiting Tech Rings -->
                <div class="gyro-ring gyro-ring-outer"></div>
                <div class="gyro-ring gyro-ring-middle"></div>
                <div class="gyro-ring gyro-ring-inner"></div>

                <!-- Central Radiant Core Crest -->
                <div class="loading-sigil-nexus">
                    <div class="sigil-core-aura"></div>
                    <img src="assets/images/corebound_logo.png" alt="Corebound Crest" class="loading-core-crest">
                    <div class="sigil-energy-spark"></div>
                </div>

                <!-- Expanding Resonance Shockwaves -->

            </div>

            <!-- Futuristic HUD Diagnostics & Progress Bar -->
            <div class="loading-hud-panel">
                <div class="loading-badge" id="loading-badge">SYSTEM INITIALIZING</div>

                <div class="loading-status-line">
                    <span class="status-indicator"></span>
                    <span class="status-text" id="loading-status-text">CALIBRATING QUANTUM MEMORY MATRIX...</span>
                </div>

                <!-- Segmented Laser Progress Bar -->
                <div class="loading-progress-container">
                    <div class="loading-progress-track">
                        <div class="loading-progress-fill" id="loading-progress-fill">

                        </div>
                    </div>
                    <div class="loading-progress-meta">
                        <span class="meta-label">TRANSFER RATE: <strong id="loading-speed">8.6 GB/s</strong></span>
                        <span class="meta-percent" id="loading-percent">0%</span>

            <!-- Final Optical Warp Flash upon 100% -->
            <div class="loading-hyper-flash" id="loading-flash"></div>

    </div>

    <!-- HalftoneReveal background effect for Phase 1 (uses OGL) -->
    <script type="module">
        import { Renderer, Program, Triangle, Mesh, Texture } from 'ogl';

        (function () {
            'use strict';

            const container = document.getElementById('halftoneContainer');
            const introScreen = document.getElementById('intro-screen');
            if (!container || !introScreen) return;

            // --- Configuration (tuned for COREBOUND fantasy theme) ---
            const CONFIG = {
                src: './assets/background/first_background.png',
                inkColor: '#0b0622',
                paperColor: '#281454',
                mode: 1,        // 1=duotone (rich cosmic colors)
                dotSize: 1.15,
                dotDensity: 78,
                angle: 45,
                shape: 0,       // 0=circle
                contrast: 1.35,
                invert: 0,
                revealRadius: 0.36,
                edge: 0.78,
                follow: 0.35,
                idleReveal: 0.12, // Ambient glow of landscape even when idle
                trigger: 1      // 0=off, 1=hover, 2=always
            };

            const hexToRgb = hex => {
                const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
                return m ? [parseInt(m[1], 16) / 255, parseInt(m[2], 16) / 255, parseInt(m[3], 16) / 255] : [0, 0, 0];
            };

            // --- GLSL Shaders ---
            const vertex = `#version 300 es
            in vec2 position;
            out vec2 vUv;
            void main() {
                vUv = position * 0.5 + 0.5;
                gl_Position = vec4(position, 0.0, 1.0);
            }`;

            const fragment = `#version 300 es
            precision highp float;

            uniform sampler2D tMap;
            uniform vec2 iResolution;
            uniform vec2 uImageSize;
            uniform vec2 uMouse;
            uniform float uActivity;
            uniform float uDotSize;
            uniform float uDensity;
            uniform float uAngle;
            uniform int uShape;
            uniform vec3 uInk;
            uniform vec3 uPaper;
            uniform int uMode;
            uniform float uContrast;
            uniform float uInvert;
            uniform float uRevealRadius;
            uniform float uEdge;
            uniform float uIdleReveal;
            uniform int uTrigger;

            in vec2 vUv;
            out vec4 fragColor;

            vec2 uAspect() {
                return vec2(iResolution.x / max(iResolution.y, 1.0), 1.0);
            }

            vec2 coverUv(vec2 uv) {
                float ia = uImageSize.x / max(uImageSize.y, 1.0);
                float pa = iResolution.x / max(iResolution.y, 1.0);
                vec2 s = pa > ia ? vec2(1.0, ia / pa) : vec2(pa / ia, 1.0);
                return (uv - 0.5) * s + 0.5;
            }

            vec3 gradeRGB(vec3 c) {
                c = clamp((c - 0.5) * uContrast + 0.5, 0.0, 1.0);
                return mix(c, 1.0 - c, uInvert);
            }

            float shapeDist(vec2 f) {
                if (uShape == 1) return max(abs(f.x), abs(f.y));
                if (uShape == 2) return abs(f.x) + abs(f.y);
                if (uShape == 3) return abs(f.y);
                return length(f);
            }

            mat2 rot(float a) {
                float c = cos(a); float s = sin(a);
                return mat2(c, -s, s, c);
            }

            vec4 sampleCell(vec2 st, float dens, float ang) {
                vec2 rp = rot(ang) * st * dens;
                vec2 center = floor(rp) + 0.5;
                vec2 stC = rot(-ang) * (center / dens);
                vec2 uvC = stC / uAspect();
                return texture(tMap, clamp(coverUv(uvC), 0.0, 1.0));
            }

            float coverage(vec2 st, float dens, float ang, float ink, float rscale) {
                vec2 rp = rot(ang) * st * dens;
                vec2 f = fract(rp) - 0.5;
                float d = shapeDist(f);
                float r = sqrt(clamp(ink, 0.0, 1.0)) * 0.72 * rscale * uDotSize;
                float w = length(fwidth(rp)) * 0.6 + 1e-4;
                return smoothstep(r + w, r - w, d);
            }

            void main() {
                vec2 aspect = uAspect();
                vec2 st = vUv * aspect;
                float ang = radians(uAngle);

                vec2 duv = (vUv - uMouse) * aspect;
                float dist = length(duv);

                float act = uTrigger == 2 ? 1.0 : (uTrigger == 0 ? 0.0 : uActivity);
                float radius = max(uRevealRadius, 1e-4) * mix(0.4, 1.0, act);

                float px = 1.4 / max(iResolution.y, 1.0);
                float band = max(px, radius * (1.0 - clamp(uEdge, 0.0, 1.0)) * 0.45);
                float loupe = 1.0 - smoothstep(radius - band, radius + band, dist);
                float focus = clamp(max(loupe * act, uIdleReveal), 0.0, 1.0);

                float dens = uDensity;

                vec3 print;
                if (uMode == 2) {
                    vec3 gc = gradeRGB(sampleCell(st, dens, ang + radians(15.0)).rgb);
                    vec3 gm = gradeRGB(sampleCell(st, dens, ang + radians(75.0)).rgb);
                    vec3 gy = gradeRGB(sampleCell(st, dens, ang).rgb);
                    vec3 gk = gradeRGB(sampleCell(st, dens, ang + radians(45.0)).rgb);
                    float c = 1.0 - gc.r; float m = 1.0 - gm.g;
                    float y = 1.0 - gy.b; float k = 1.0 - dot(gk, vec3(0.299, 0.587, 0.114));
                    float gcr = min(min(c, m), y) * 0.5;
                    c = clamp(c - gcr, 0.0, 1.0); m = clamp(m - gcr, 0.0, 1.0);
                    y = clamp(y - gcr, 0.0, 1.0); k = clamp(max(gcr, k * k * 0.9), 0.0, 1.0);
                    float covC = coverage(st, dens, ang + radians(15.0), c, 0.82);
                    float covM = coverage(st, dens, ang + radians(75.0), m, 0.82);
                    float covY = coverage(st, dens, ang, y, 0.82);
                    float covK = coverage(st, dens, ang + radians(45.0), k, 0.78);
                    print = uPaper;
                    print = mix(print, print * vec3(0.10, 0.72, 0.90), covC);
                    print = mix(print, print * vec3(0.92, 0.10, 0.52), covM);
                    print = mix(print, print * vec3(0.98, 0.86, 0.10), covY);
                    print = mix(print, print * vec3(0.08), covK);
                } else if (uMode == 1) {
                    vec3 ink2 = mix(uInk.gbr, vec3(0.90, 0.24, 0.30), 0.7);
                    float lumA = dot(gradeRGB(sampleCell(st, dens, ang).rgb), vec3(0.299, 0.587, 0.114));
                    float lumB = dot(gradeRGB(sampleCell(st, dens, ang + radians(38.0)).rgb), vec3(0.299, 0.587, 0.114));
                    float covA = coverage(st, dens, ang, 1.0 - lumA, 1.0);
                    float covB = coverage(st, dens, ang + radians(38.0), pow(1.0 - lumB, 1.4), 0.92);
                    print = uPaper;
                    print = mix(print, ink2, covB * 0.85);
                    print = mix(print, uInk, covA);
                } else {
                    float lum = dot(gradeRGB(sampleCell(st, dens, ang).rgb), vec3(0.299, 0.587, 0.114));
                    float cov = coverage(st, dens, ang, 1.0 - lum, 1.0);
                    print = mix(uPaper, uInk, cov);
                }

                float t = clamp(dist / radius, 0.0, 1.0);
                float bend = t * t * t * t;
                vec2 dir = dist > 1e-5 ? duv / dist : vec2(0.0);
                vec2 off = dir * bend * radius * 0.22 / aspect;
                vec2 ca = dir * bend * 0.0045 / aspect;
                vec3 sharp = gradeRGB(vec3(
                    texture(tMap, clamp(coverUv(vUv - off - ca), 0.0, 1.0)).r,
                    texture(tMap, clamp(coverUv(vUv - off), 0.0, 1.0)).g,
                    texture(tMap, clamp(coverUv(vUv - off + ca), 0.0, 1.0)).b
                ));

                vec3 col = mix(print, sharp, focus);
                fragColor = vec4(col, 1.0);
            }`;

            // --- OGL Setup ---
            const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const renderer = new Renderer({
                dpr: Math.min(window.devicePixelRatio || 1, 2),
                alpha: false,
                antialias: true
            });
            const gl = renderer.gl;
            gl.clearColor(0.02, 0.008, 0.1, 1);
            gl.canvas.style.width = '100%';
            gl.canvas.style.height = '100%';
            gl.canvas.style.display = 'block';
            container.appendChild(gl.canvas);

            const texture = new Texture(gl, { generateMipmaps: false });

            const uniforms = {
                tMap: { value: texture },
                iResolution: { value: [1, 1] },
                uImageSize: { value: [1, 1] },
                uMouse: { value: [0.5, 0.5] },
                uActivity: { value: 0 },
                uDotSize: { value: CONFIG.dotSize },
                uDensity: { value: CONFIG.dotDensity },
                uAngle: { value: CONFIG.angle },
                uShape: { value: CONFIG.shape },
                uInk: { value: hexToRgb(CONFIG.inkColor) },
                uPaper: { value: hexToRgb(CONFIG.paperColor) },
                uMode: { value: CONFIG.mode },
                uContrast: { value: CONFIG.contrast },
                uInvert: { value: CONFIG.invert },
                uRevealRadius: { value: CONFIG.revealRadius },
                uEdge: { value: CONFIG.edge },
                uIdleReveal: { value: CONFIG.idleReveal },
                uTrigger: { value: CONFIG.trigger }
            };

            const program = new Program(gl, { vertex, fragment, uniforms });
            const mesh = new Mesh(gl, { geometry: new Triangle(gl), program });

            // Load background image
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = CONFIG.src;
            const onTextureReady = () => {
                texture.image = img;
                uniforms.uImageSize.value = [img.naturalWidth, img.naturalHeight];
                if (gl.canvas) {
                    gl.canvas.classList.add('ready');
                }
            };
            img.onload = onTextureReady;
            if (img.complete) {
                onTextureReady();
            }

            // Resize handler
            const resize = () => {
                const w = container.clientWidth || 1;
                const h = container.clientHeight || 1;
                renderer.setSize(w, h);
                uniforms.iResolution.value = [gl.canvas.width, gl.canvas.height];
            };
            resize();
            const ro = new ResizeObserver(resize);
            ro.observe(container);

            // Mouse tracking for loupe effect
            const mouse = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5, active: 0, target: 0 };

            const onMove = e => {
                const rect = container.getBoundingClientRect();
                mouse.x = (e.clientX - rect.left) / rect.width;
                mouse.y = 1 - (e.clientY - rect.top) / rect.height;
                mouse.target = reduced ? 0 : 1;
            };
            const onLeave = () => { mouse.target = 0; };

            introScreen.addEventListener('pointermove', onMove, { passive: true });
            introScreen.addEventListener('pointerenter', onMove, { passive: true });
            introScreen.addEventListener('pointerleave', onLeave, { passive: true });

            // Render loop
            let rafId = null;
            let prev = performance.now();

            const loop = (now) => {
                rafId = requestAnimationFrame(loop);
                const dt = Math.min(0.05, Math.max(0.001, (now - prev) / 1000));
                prev = now;

                const a = 1 - Math.exp(-dt / Math.max(0.001, CONFIG.follow));
                mouse.sx += (mouse.x - mouse.sx) * a;
                mouse.sy += (mouse.y - mouse.sy) * a;
                const ba = 1 - Math.exp(-dt / 0.18);
                mouse.active += (mouse.target - mouse.active) * ba;

                uniforms.uMouse.value[0] = mouse.sx;
                uniforms.uMouse.value[1] = mouse.sy;
                uniforms.uActivity.value = mouse.active;

                renderer.render({ scene: mesh });
                if (gl.canvas && !gl.canvas.classList.contains('ready')) {
                    gl.canvas.classList.add('ready');
                }
            };
            rafId = requestAnimationFrame(loop);

            // Clean up WebGL and listeners when leaving intro screen
            const cleanupHalftone = () => {
                if (rafId) cancelAnimationFrame(rafId);
                ro.disconnect();
                introScreen.removeEventListener('pointermove', onMove);
                introScreen.removeEventListener('pointerenter', onMove);
                introScreen.removeEventListener('pointerleave', onLeave);
                const ext = gl.getExtension('WEBGL_lose_context');
                if (ext) ext.loseContext();
                if (gl.canvas && gl.canvas.parentNode) gl.canvas.parentNode.removeChild(gl.canvas);
            };

            const btnBegin = document.getElementById('btn-begin-story');
            if (btnBegin) btnBegin.addEventListener('click', cleanupHalftone, { once: true });
            const btnSkip = document.getElementById('btn-skip-intro');
            if (btnSkip) btnSkip.addEventListener('click', cleanupHalftone, { once: true });
        })();
    </script>

    <script src="script1.js"></script>

</body>
